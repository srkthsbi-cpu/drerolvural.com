<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 225"><style>.e{transform-origin:150px 112px;animation:f 5.8s ease-in-out infinite}.b{animation:b 7s linear infinite}.h{animation:h 7s linear infinite}.talk{display:none}.is-talking .talk{display:block}.is-talking .mouth{animation:t .22s ease-in-out infinite alternate}@keyframes f{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-2px) rotate(.5deg)}}@keyframes b{0%,48%,100%{opacity:0}50%,54%{opacity:1}56%{opacity:0}}@keyframes h{0%,60%{opacity:0}62%,68%{opacity:1}70%,100%{opacity:0}}@keyframes t{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){.e{animation:none}.b,.h{animation:none;opacity:0}}</style><g class="e"><image href="data:image/webp;base64," x="0" y="0" width="300" height="225"/><ellipse class="b" cx="116" cy="138" rx="32" ry="9" fill="#082034"/><ellipse class="b" cx="184" cy="138" rx="32" ry="9" fill="#082034"/><g class="talk"><ellipse cx="150" cy="163" rx="24" ry="11" fill="#082034"/><path class="mouth" d="M139 163 Q150 177 161 163" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><g class="h"><path d="M139 164 Q150 176 161 164" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></g></svg>