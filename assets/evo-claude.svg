<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" role="img" aria-label="EVO sağlık asistanı">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".62" stop-color="#f4f8fb"/><stop offset="1" stop-color="#d9e6ec"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142b52"/><stop offset=".55" stop-color="#06204b"/><stop offset="1" stop-color="#00183d"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1ee8ff"/><stop offset="1" stop-color="#008db7"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9bcf00"/><stop offset="1" stop-color="#55a600"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#006b96" flood-opacity=".18"/></filter>
 <style>
  .stage{animation:float 3.2s ease-in-out infinite;transform-origin:250px 170px}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
  .eye.r{animation-delay:.18s}.pupil{animation:look 6s ease-in-out infinite}
  .brow{animation:brow 6s ease-in-out infinite}.mouth{animation:mouth 3s ease-in-out infinite}
  .ear{animation:glow 2.4s ease-in-out infinite}.ear.r{animation-delay:-1.2s}
  @keyframes float{50%{transform:translateY(-2px)}}
  @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
  @keyframes look{0%,20%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}40%{transform:translateX(4px)}}
  @keyframes brow{0%,65%,100%{transform:translateY(0)}70%{transform:translateY(-3px)}75%{transform:translateY(1px)}}
  @keyframes mouth{0%,70%,100%{transform:scaleY(1)}74%{transform:scaleY(.72)}78%{transform:scaleY(1.08)}}
  @keyframes glow{50%{filter:drop-shadow(0 0 8px #25e7ff)}}
  .is-happy .mouth{transform:scale(1.15)}.is-talking .mouth{animation:talk .16s ease-in-out infinite alternate}
  @keyframes talk{from{transform:scaleY(.65)}to{transform:scaleY(1.2)}}
  .is-sleepy .eye{animation:none;transform:scaleY(.08)}
  @media(prefers-reduced-motion:reduce){.stage,.eye,.pupil,.brow,.mouth,.ear{animation:none!important}}
 </style>
</defs>
<g class="stage" filter="url(#shadow)">
 <!-- ears -->
 <g class="ear"><circle cx="62" cy="190" r="43" fill="url(#shell)" stroke="#087da2" stroke-width="5"/><circle cx="62" cy="190" r="24" fill="#062a52" stroke="url(#cyan)" stroke-width="8"/><circle cx="62" cy="190" r="9" fill="#8cf6ff" filter="url(#glow)"/></g>
 <g class="ear r"><circle cx="438" cy="190" r="44" fill="url(#shell)" stroke="#087da2" stroke-width="5"/><circle cx="438" cy="190" r="25" fill="#062a52" stroke="url(#cyan)" stroke-width="8"/><circle cx="438" cy="190" r="9" fill="#8cf6ff" filter="url(#glow)"/></g>
 <!-- outer helmet -->
 <path d="M250 22C135 22 43 92 43 199v22c0 55 45 97 101 97h212c56 0 101-42 101-97v-22C457 92 365 22 250 22Z" fill="url(#shell)" stroke="#087da2" stroke-width="4"/>
 <path d="M95 171c13-73 73-116 155-116s142 43 155 116" fill="none" stroke="#d7e4eb" stroke-width="12" stroke-linecap="round"/>
 <!-- top vent -->
 <path d="M191 27h118c7 0 12 6 11 13l-5 23H185l-5-23c-1-7 4-13 11-13Z" fill="url(#cyan)" stroke="#057c9e" stroke-width="4"/>
 <!-- face screen -->
 <path d="M104 185c0-43 35-78 78-78h136c43 0 78 35 78 78v56c0 31-25 56-56 56H160c-31 0-56-25-56-56Z" fill="url(#screen)" stroke="#0a94d2" stroke-width="5"/>
 <path d="M121 237c25 23 54 34 86 34h86c32 0 61-11 86-34" fill="none" stroke="#06366d" stroke-width="7" opacity=".7"/>
 <!-- logo -->
 <g transform="translate(250 88)">
   <path d="M-19-19c-15 3-25 13-28 28-2 11 3 21 13 27l18-8c-7-7-8-15-5-23 3-8 10-14 19-17Z" fill="url(#green)"/>
   <path d="M4-29c-7 10-8 21-4 32 4 11 13 18 26 21l11-15c-9-2-15-7-18-14-3-8-2-16 3-24Z" fill="#079bb2"/>
   <path d="M-8 28c15 1 28-4 37-14l10 10C28 41 10 48-8 42c-7-2-13-5-18-10Z" fill="#079bb2"/>
   <circle cx="25" cy="-14" r="5" fill="#fff"/>
 </g>
 <!-- brows -->
 <g class="brow" fill="none" stroke="#18e6ff" stroke-width="7" stroke-linecap="round"><path d="M130 183Q160 164 190 183"/><path d="M310 183Q340 164 370 183"/></g>
 <!-- eyes -->
 <g class="eye"><ellipse cx="162" cy="222" rx="27" ry="32" fill="#0de4f2"/><ellipse cx="162" cy="224" rx="15" ry="21" fill="#06152e"/><circle cx="168" cy="215" r="6" fill="#fff"/><circle cx="156" cy="233" r="2.5" fill="#fff"/></g>
 <g class="eye r"><ellipse cx="338" cy="222" rx="27" ry="32" fill="#0de4f2"/><ellipse cx="338" cy="224" rx="15" ry="21" fill="#06152e"/><circle cx="344" cy="215" r="6" fill="#fff"/><circle cx="332" cy="233" r="2.5" fill="#fff"/></g>
 <!-- mouth -->
 <path class="mouth" d="M205 255Q231 273 257 255" fill="none" stroke="#e8ffff" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
</g>
</svg>