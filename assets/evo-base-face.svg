<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-label="EVO sağlık asistanı">
<defs>
<radialGradient id="i"><stop stop-color="#f4ffff"/><stop offset=".42" stop-color="#5fffe2"/><stop offset="1" stop-color="#10cfae"/></radialGradient>
<linearGradient id="m" x1="0" x2="1"><stop stop-color="#45fff0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#45fff0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.e{transform-box:fill-box;transform-origin:center;animation:b 6s ease-in-out infinite}.e.r{animation-delay:.18s}
.p{transform-box:fill-box;transform-origin:center;animation:l 7s ease-in-out infinite}
.br{transform-box:fill-box;transform-origin:center;animation:br 6.5s ease-in-out infinite}
.mo{transform-box:fill-box;transform-origin:center;animation:t 3.8s ease-in-out infinite}
@keyframes b{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.06)}}
@keyframes l{0%,20%,100%{transform:translateX(0)}28%{transform:translateX(-6px)}36%{transform:translateX(6px)}44%{transform:translateX(0)}}
@keyframes br{0%,65%,100%{transform:translateY(0)}70%{transform:translateY(-5px)}75%{transform:translateY(1px)}}
@keyframes t{0%,70%,100%{transform:scaleY(1)}73%{transform:scaleY(.7)}76%{transform:scaleY(1.05)}79%{transform:scaleY(.78)}82%{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.e,.p,.br,.mo{animation:none}}
</style></defs>
<image href="data:image/webp;base64," width="900" height="675"/>
<!-- Kodla eklenen tek yüz katmanı: göz + kaş + ağız -->
<g class="br" fill="none" stroke="#55f5e6" stroke-width="9" stroke-linecap="round" filter="url(#g)">
<path d="M286 350Q322 328 356 349"/><path d="M544 349Q578 328 614 350"/>
</g>
<g class="e"><ellipse cx="325" cy="403" rx="49" ry="58" fill="url(#i)" filter="url(#g)"/><ellipse class="p" cx="328" cy="406" rx="24" ry="32" fill="#02080d"/><circle cx="343" cy="389" r="9" fill="#fff"/><circle cx="318" cy="423" r="4" fill="#fff"/></g>
<g class="e r"><ellipse cx="575" cy="403" rx="49" ry="58" fill="url(#i)" filter="url(#g)"/><ellipse class="p" cx="578" cy="406" rx="24" ry="32" fill="#02080d"/><circle cx="593" cy="389" r="9" fill="#fff"/><circle cx="568" cy="423" r="4" fill="#fff"/></g>
<path class="mo" d="M421 468Q450 489 479 468" fill="none" stroke="url(#m)" stroke-width="10" stroke-linecap="round" filter="url(#g)"/>
</svg>