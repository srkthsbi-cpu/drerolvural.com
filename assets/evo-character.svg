<svg class="evo-svg" viewBox="0 0 420 360" role="img" aria-label="EVO sağlık asistanı" xmlns="http://www.w3.org/2000/svg">
<style>.evo-brow{transform-box:fill-box;transform-origin:center;animation:evoBrow 5.7s ease-in-out infinite}.evo-eye{transform-box:fill-box;transform-origin:center;animation:evoBlink 6.2s ease-in-out infinite}.evo-eye.r{animation-delay:.17s}.evo-pupil{transform-box:fill-box;transform-origin:center;transition:transform .28s ease}.evo-mouth{transform-box:fill-box;transform-origin:center;animation:evoSmile 5s ease-in-out infinite}.evo-glow{animation:evoGlow 3.4s ease-in-out infinite}.is-attention .evo-pupil{transform:translateY(-2px) scale(1.04)}.is-thinking .evo-pupil{transform:translate(8px,-4px)}.is-talking .evo-mouth{animation:evoTalk .24s ease-in-out infinite alternate}@keyframes evoBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}@keyframes evoBrow{0%,72%,100%{transform:translateY(0)}76%{transform:translateY(-5px)}80%{transform:translateY(1px)}}@keyframes evoSmile{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}@keyframes evoTalk{from{transform:scaleY(.7)}to{transform:scaleY(1.25)}}@keyframes evoGlow{0%,100%{opacity:.72}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.evo-svg *{animation:none!important;transition:none!important}}</style>
