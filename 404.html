<title>Sayfa Bulunamadı | Doç. Dr. Erol VURAL</title>

<style>
        :root {
            --primary-blue: #005082;
            --secondary-teal: #009bb4;
            --accent-green: #82bc00;
            --text-dark: #333333;
            --text-gray: #666666;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(0, 80, 130, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: var(--text-dark);
            background: linear-gradient(135deg, #f0f8ff 0%, #f8fcfd 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 50px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: var(--glass-shadow);
        }

        .error-card i {
            font-size: 60px;
            color: var(--secondary-teal);
            margin-bottom: 20px;
        }

        .error-card h1 {
            font-size: 28px;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }

        .error-card p {
            font-size: 15px;
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 80, 130, 0.2);
        }

        .home-btn:hover {
            background-color: var(--secondary-teal);
            transform: translateY(-2px);
        }
    </style>
<style id="unified-language-menu">
/* Unified compact language control — same size on every page */
.lang-btn,.langicon,.lang{
  height:38px !important;
  min-width:82px !important;
  width:82px !important;
  box-sizing:border-box !important;
  padding:0 9px !important;
  border:1px solid #009bb4 !important;
  border-radius:999px !important;
  background:#fff !important;
  color:#005082 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:6px !important;
  font-size:14px !important;
  font-weight:700 !important;
  line-height:1 !important;
}
.lang-btn:hover,.langicon:hover,.lang:hover{background:#fbfeff !important;border-color:#009bb4 !important}
.lang-btn i:first-child,.langicon:first-child,.lang:first-child{font-size:16px !important}
.langicon:after,.lang:after{content:'⌄';font-size:14px;font-weight:700;line-height:1;margin-left:0}
.langicon span,.lang span,#currentLangText{display:inline-block !important;font-size:14px !important;font-weight:700 !important;max-width:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-content,.language-menu,.langmenu{
  position:absolute !important;
  top:46px !important;
  right:0 !important;
  z-index:9999 !important;
  width:170px !important;
  min-width:170px !important;
  max-width:calc(100vw - 28px) !important;
  box-sizing:border-box !important;
  background:#fff !important;
  border:1px solid #e2e8ec !important;
  border-radius:20px !important;
  box-shadow:0 14px 34px rgba(0,0,0,.14) !important;
  padding:8px !important;
}
.lang-content button,.language-menu a,.langmenu button{
  display:flex !important;
  align-items:center !important;
  width:100% !important;
  min-height:44px !important;
  box-sizing:border-box !important;
  padding:8px 12px !important;
  border:0 !important;
  border-radius:12px !important;
  background:#fff !important;
  color:#254f77 !important;
  font-size:16px !important;
  font-weight:700 !important;
  line-height:1.2 !important;
  text-align:left !important;
  cursor:pointer !important;
}
.lang-content button:hover,.language-menu a:hover,.langmenu button:hover{background:#f5f8fa !important}
.lang-content button[aria-current="true"],.lang-content button.active,.language-menu a[aria-current="true"],.language-menu a.active,.langmenu button[aria-current="true"]{background:#f0f9eb !important;color:#005082 !important}
html[dir="rtl"] .lang-content,html[dir="rtl"] .language-menu,html[dir="rtl"] .langmenu{right:auto !important;left:0 !important}
html[dir="rtl"] .lang-content button,html[dir="rtl"] .language-menu a,html[dir="rtl"] .langmenu button{text-align:right !important}
@media(max-width:600px){
  .lang-btn,.langicon,.lang{height:38px !important;min-width:82px !important;width:82px !important;padding:0 9px !important;font-size:14px !important}
  .langicon span,.lang span,#currentLangText{font-size:14px !important;max-width:32px}
  .lang-content,.language-menu,.langmenu{top:46px !important;width:170px !important;min-width:170px !important;max-width:calc(100vw - 20px) !important;border-radius:14px !important;padding:5px !important}
  .lang-content button,.language-menu a,.langmenu button{min-height:34px !important;font-size:14px !important;padding:6px 9px !important}
}
</style>
